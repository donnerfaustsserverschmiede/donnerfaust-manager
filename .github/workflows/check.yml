name: Code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Import bot and dashboard
        env:
          DISCORD_TOKEN: test-token
          DISCORD_CLIENT_ID: "1559529951303041054"
          DISCORD_CLIENT_SECRET: test-secret
          SESSION_SECRET: test-session-secret-for-ci
          DASHBOARD_BASE_URL: https://example.onrender.com
        run: python -c "import bot; import dashboard.app; print('Bot and dashboard imports OK')"
