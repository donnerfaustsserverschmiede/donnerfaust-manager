name: Discord changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Publish commit summary to Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manueller Changelog-Test' }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || 'Donnerfaust Manager' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = os.environ.get("DISCORD_CHANGELOG_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_CHANGELOG_WEBHOOK secret is not configured; cannot publish changelog.")
              sys.exit(1)

          message = os.environ.get("COMMIT_MESSAGE", "").strip().splitlines()[0][:180]
          author = os.environ.get("COMMIT_AUTHOR", "Donnerfaust Manager")[:80]
          url = os.environ.get("COMMIT_URL", "")
          sha = os.environ.get("COMMIT_SHA", "")[:7]
          content = f"**Donnerfaust Manager – Changelog**\n{message}\nÄnderung: {sha} · von {author}\n{url}"
          payload = json.dumps({"content": content[:1900], "allowed_mentions": {"parse": []}}).encode()
          req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=15) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          print("Changelog successfully published to Discord.")
          PY
