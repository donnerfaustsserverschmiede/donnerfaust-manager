name: Deutscher täglicher Changelog

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-changelog:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[send-changelog-now]')
    runs-on: ubuntu-latest
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deutsche Tageszusammenfassung an Discord senden
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Berlin")
          now = datetime.now(tz)

          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and now.hour != 18:
              print(f"Übersprungen: lokale Uhrzeit ist {now:%H:%M %Z}.")
              sys.exit(0)

          webhook = os.environ.get("DISCORD_CHANGELOG_WEBHOOK", "").strip()
          if not webhook:
              print("Das Discord-Webhook-Secret ist nicht eingerichtet.")
              sys.exit(1)

          cutoff = datetime.combine(now.date(), time(18, 0), tzinfo=tz)
          if now.hour == 18 or now < cutoff:
              cutoff -= timedelta(days=1)

          # Manually triggered retroactive send: publish a fresh German summary now.
          # Read commit subjects and changed paths, but never publish raw titles,
          # hashes, file paths, or links to Discord.
          raw = subprocess.check_output(
              ["git", "log", f"--since={cutoff.isoformat()}",
               "--format=COMMIT:%s", "--name-only"],
              text=True,
          ).strip()

          commits = []
          subject = ""
          paths = []
          for line in raw.splitlines():
              if line.startswith("COMMIT:"):
                  if subject:
                      commits.append((subject, paths))
                  subject = line[len("COMMIT:"):].strip()
                  paths = []
              elif line.strip():
                  paths.append(line.strip())
          if subject:
              commits.append((subject, paths))

          categories = set()
          for subject, paths in commits:
              all_text = " ".join([subject] + paths).lower()
              if ".github/workflows/changelog.yml" in all_text or "changelog" in all_text or "discord webhook" in all_text:
                  categories.add("changelog")
              if any(token in all_text for token in ("ticket", "support", "case")):
                  categories.add("tickets")
              if any(token in all_text for token in ("moderation", "ban", "timeout", "warn", "kick")):
                  categories.add("moderation")
              if any(token in all_text for token in ("logging", "audit", "log_event")):
                  categories.add("logging")
              if any(token in all_text for token in ("oauth", "login", "auth", "session", "permission")):
                  categories.add("login")
              if any(token in all_text for token in ("dashboard", "web/", "templates/", "static/")):
                  categories.add("website")
              if any(token in all_text for token in ("database", "migration", "schema", ".sql")):
                  categories.add("database")
              if any(token in all_text for token in ("test", "pytest", "spec")):
                  categories.add("tests")
              if any(token in all_text for token in ("requirements", "pyproject", "dockerfile", "render.yaml", "runtime.txt", "deploy")):
                  categories.add("betrieb")
              if any(token in all_text for token in ("bot.py", "main.py", "commands", "cogs/", "discord")):
                  categories.add("bot")
              if any(token in all_text for token in ("readme", "docs/", "documentation")):
                  categories.add("docs")

          summaries = {
              "changelog": "Die tägliche Änderungsübersicht verbessert: Sie wird gesammelt auf Deutsch und ohne technische Verweise veröffentlicht.",
              "tickets": "Am Ticketsystem gearbeitet, damit Support-Anfragen besser verwaltet werden können.",
              "moderation": "Die Moderationsfunktionen des Bots bearbeitet.",
              "logging": "Die Protokollierung von Serverereignissen bearbeitet.",
              "login": "Anmeldung und Berechtigungsprüfung überarbeitet.",
              "website": "Die Verwaltungswebsite und ihre Bedienoberfläche bearbeitet.",
              "database": "Die Datenspeicherung und Datenbankstruktur angepasst.",
              "tests": "Prüfungen ergänzt oder angepasst, um Fehler früher zu erkennen.",
              "betrieb": "Die Einrichtung oder Bereitstellung des Bots überarbeitet.",
              "bot": "Funktionen und Abläufe des Discord-Bots bearbeitet.",
              "docs": "Die Projektdokumentation aktualisiert.",
          }

          order = ["tickets", "moderation", "logging", "login", "website",
                   "database", "bot", "tests", "betrieb", "docs", "changelog"]
          entries = [summaries[key] for key in order if key in categories]

          # If changes were made but no known component matched, do not expose
          # raw commit messages. Report only a neutral, honest summary.
          if not entries and commits:
              entries = ["Am Projekt wurden Änderungen vorgenommen; die betroffenen Bereiche konnten nicht zuverlässig zugeordnet werden."]
          elif not entries:
              entries = ["Seit der letzten Zusammenfassung wurden keine neuen Änderungen gespeichert."]

          heading = f"Änderungen seit {cutoff:%d.%m., %H:%M} Uhr"
          content = (
              "## Donnerfaust Manager – täglicher Changelog\n"
              f"**{heading}**\n\n"
              + "\n".join("• " + entry for entry in entries)
              + "\n\n_Automatische Tageszusammenfassung der Arbeiten am Donnerfaust Manager._"
          )

          if len(content) > 1900:
              content = content[:1850].rsplit("\n", 1)[0] + "\nWeitere Arbeiten wurden in dieser Übersicht zusammengefasst."

          payload = json.dumps({"content": content, "allowed_mentions": {"parse": []}}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/donnerfaustsserverschmiede/donnerfaust-manager, 1.0)"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f"Discord meldete HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")[:1000]
              print(f"Discord-Versand fehlgeschlagen (HTTP {exc.code}): {detail}")
              raise SystemExit(1)
          except urllib.error.URLError as exc:
              print(f"Discord konnte nicht erreicht werden: {exc.reason}")
              raise SystemExit(1)

          print(f"Deutsche Tageszusammenfassung erfolgreich gesendet. Zeitraum ab {cutoff.isoformat()}.")
          PY
