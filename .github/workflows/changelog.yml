name: Discord daily changelog digest

on:
  # GitHub cron uses UTC. Run at both candidate hours and let Python
  # publish only when it is 18:00 in Europe/Berlin (handles DST).
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish one daily changelog digest to Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Berlin")
          now = datetime.now(tz)

          # Scheduled runs are triggered at both UTC hours to accommodate
          # daylight-saving time. Only the run at local 18:00 may post.
          # Manual dispatches are allowed to post immediately for testing.
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and now.hour != 18:
              print(f"Skipping duplicate DST candidate; local time is {now:%H:%M %Z}.")
              sys.exit(0)

          webhook = os.environ.get("DISCORD_CHANGELOG_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_CHANGELOG_WEBHOOK secret is not configured.")
              sys.exit(1)

          # Summarize the period since the previous 18:00 in Europe/Berlin.
          cutoff = datetime.combine(now.date(), time(18, 0), tzinfo=tz)
          if now.hour == 18 or now < cutoff:
              cutoff -= timedelta(days=1)
          since = cutoff.isoformat()

          raw = subprocess.check_output(
              ["git", "log", f"--since={since}", "--date=short",
               "--pretty=format:%h%x09%s"],
              text=True,
          ).strip()

          entries = []
          for line in raw.splitlines():
              parts = line.split("\\t", 1)
              if len(parts) == 2:
                  sha, subject = parts
                  entries.append(f"• **{subject}** ([{sha}](https://github.com/donnerfaustsserverschmiede/donnerfaust-manager/commit/{sha}))")

          if entries:
              body = "\\n".join(entries)
              heading = f"**Änderungen seit {cutoff:%d.%m., %H:%M} Uhr**"
          else:
              body = "Seit der letzten Zusammenfassung wurden keine neuen Commits auf `main` gefunden."
              heading = f"**Tageszusammenfassung – {now:%d.%m.%Y}**"

          content = (
              "## Donnerfaust Manager – tägliches Changelog\\n"
              f"{heading}\\n\\n{body}\\n\\n"
              "_Automatisch erstellt; aufgeführt sind die Änderungen aus GitHub-Commits._"
          )

          # Discord message content limit is 2000 characters.
          if len(content) > 1950:
              content = content[:1880].rsplit("\\n", 1)[0] + "\\n… (gekürzt; siehe Commit-Links oben)."

          payload = json.dumps({
              "content": content,
              "allowed_mentions": {"parse": []}
          }).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/donnerfaustsserverschmiede/donnerfaust-manager, 1.0)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")[:1000]
              print(f"Discord webhook failed with HTTP {exc.code}: {detail}")
              raise SystemExit(1)
          except urllib.error.URLError as exc:
              print(f"Could not reach Discord webhook endpoint: {exc.reason}")
              raise SystemExit(1)

          print(f"Daily changelog digest successfully published for period since {since}.")
          PY
