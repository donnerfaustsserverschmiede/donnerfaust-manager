name: Discord changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish detailed changelog to Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manueller Changelog-Test' }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || 'Donnerfaust Manager' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          import urllib.error

          webhook = os.environ.get("DISCORD_CHANGELOG_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_CHANGELOG_WEBHOOK secret is not configured.")
              sys.exit(1)

          commit_message = os.environ.get("COMMIT_MESSAGE", "Änderungen am Donnerfaust Manager").strip()
          author = os.environ.get("COMMIT_AUTHOR", "Donnerfaust Manager").strip()[:80]
          url = os.environ.get("COMMIT_URL", "")
          sha = os.environ.get("COMMIT_SHA", "")[:7]

          try:
              changelog = subprocess.check_output(
                  ["git", "show", "HEAD:CHANGELOG.md"], text=True, stderr=subprocess.DEVNULL
              )
          except (subprocess.CalledProcessError, FileNotFoundError):
              changelog = ""

          # Post the first dated section from CHANGELOG.md, if present.
          match = re.search(r"(?m)^## .+", changelog)
          if match:
              start = match.start()
              next_section = re.search(r"(?m)^## .+", changelog[match.end():])
              end = match.end() + next_section.start() if next_section else len(changelog)
              body = changelog[start:end].strip()
          else:
              body = (
                  f"## Änderung: {commit_message.splitlines()[0][:180]}\n"
                  "Für diese Änderung wurde noch kein ausführlicher Eintrag in CHANGELOG.md ergänzt."
              )

          content = (
              f"**Donnerfaust Manager – Changelog**\n"
              f"{body}\n\n"
              f"**Commit:** {sha} · **von:** {author}\n{url}"
          )
          # Discord message content is limited to 2000 characters.
          payload = json.dumps({
              "content": content[:1950],
              "allowed_mentions": {"parse": []}
          }).encode()
          req = urllib.request.Request(
              webhook, data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/donnerfaustsserverschmiede/donnerfaust-manager, 1.0)"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              # Discord's JSON error explains permission/access failures. Never print the webhook URL.
              try:
                  detail = exc.read().decode("utf-8", errors="replace")[:1000]
              except Exception:
                  detail = "(Discord did not return an error body)"
              print(f"Discord webhook failed with HTTP {exc.code}: {detail}")
              raise SystemExit(1)
          except urllib.error.URLError as exc:
              print(f"Could not reach Discord webhook endpoint: {exc.reason}")
              raise SystemExit(1)
          print("Detailed changelog successfully published.")
          PY
